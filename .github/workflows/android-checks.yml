name: Android app checks and APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo export --platform android
      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Diagnose Expo Android autolinking modules
        run: |
          npx expo-modules-autolinking resolve --platform android --json > /tmp/expo-modules-android.json
          node -e "const d=require('/tmp/expo-modules-android.json'); const m=d.modules||d; console.log(JSON.stringify(m.map((x,i)=>({index:i,name:x.packageName||x.name||x.moduleName,projects:x.projects?.map(p=>({name:p.name,publication:p.publication}))})),null,2))"
      - name: Build standalone release APK with embedded JavaScript bundle
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Carnet-Auto-DZ-Standalone-Android-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
